name: SDK compatibility alert router

# Posts each new failure of an SDK compatibility workflow on main to
# #oncall-alerts, where MeowBot opens a fix pull request. The watched
# workflows are listed in scripts/compat_alert_router.py.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Look back this many hours instead of to the last successful router run'
        required: false
        default: ''
      dry_run:
        description: 'Print the messages without posting them to Slack'
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: compat-alert-router
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post new compatibility failures to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python scripts/compat_alert_router.py

  notify-failure:
    runs-on: ubuntu-latest
    needs: route
    if: failure()
    steps:
      - name: Report router failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg url "$RUN_URL" '{text: "⚠️ compat-alert-router FAILED. SDK compatibility failures are not reaching Slack: \($url)"}' \
            | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
